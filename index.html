<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon_32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon_16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon_180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Web fonts loaded async so they never block first paint. The stylesheet
         is fetched as a preload, then flipped to a stylesheet on load; text
         paints immediately in the fallback face (display=swap) and upgrades
         when the web font arrives. <noscript> keeps it working without JS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      />
    </noscript>

    <title>MedXFlow - AI Revenue Cycle Management &amp; Medical Billing</title>
    <meta
      name="description"
      content="AI revenue cycle management for medical practices - eligibility, prior auth, claims, denial management and patient collections, on Epic and athenahealth."
    />
    <meta name="robots" content="index, follow" />

    <!-- Canonical - update to your live domain -->
    <link rel="canonical" href="https://medxflow.ai/" />

    <!-- Open Graph (LinkedIn, Facebook, iMessage, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MedXFlow Health" />
    <meta property="og:title" content="MedXFlow - AI Revenue Cycle Management &amp; Medical Billing" />
    <meta
      property="og:description"
      content="AI revenue cycle management - eligibility, prior auth, claims, denials and collections - plus a 24/7 AI receptionist. Integrated with Epic and athenahealth."
    />
    <meta property="og:url" content="https://medxflow.ai/" />
    <meta property="og:image" content="https://medxflow.ai/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MedXFlow - AI revenue cycle management and medical billing for practices" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MedXFlow - AI Revenue Cycle Management &amp; Medical Billing" />
    <meta
      name="twitter:description"
      content="AI revenue cycle management - eligibility, prior auth, claims, denials and collections - plus a 24/7 AI receptionist. Integrated with Epic and athenahealth."
    />
    <meta name="twitter:image" content="https://medxflow.ai/og-cover.jpg" />

    <meta name="theme-color" content="#0D2B52" />

    <!-- Structured data: Organization, WebSite, Service, FAQ -->

      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://medxflow.ai/#organization",
            "name": "MedXFlow",
            "alternateName": "MedXFlow Health",
            "url": "https://medxflow.ai/",
            "logo": "https://medxflow.ai/logo.png",
            "description": "AI revenue cycle management and front-desk automation for medical practices - eligibility, prior authorization, claims, denial management and patient collections, plus a 24/7 AI receptionist and check-in, integrated with Epic and athenahealth.",
            "email": "sales@medxflow.ai",
            "telephone": "+1-210-396-9718",
            "areaServed": "US",
            "sameAs": [
              "https://www.facebook.com/1279975571858250",
              "https://www.instagram.com/medx.flow/",
              "https://www.youtube.com/channel/UCOULlJsQ5-g8CYrVEooT3WA"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://medxflow.ai/#website",
            "url": "https://medxflow.ai/",
            "name": "MedXFlow",
            "publisher": { "@id": "https://medxflow.ai/#organization" },
            "inLanguage": "en-US"
          },
          {
            "@type": "Service",
            "name": "MedXFlow - AI revenue cycle management for medical practices",
            "serviceType": "Revenue cycle management, medical billing and AI front desk",
            "provider": { "@id": "https://medxflow.ai/#organization" },
            "areaServed": { "@type": "Country", "name": "United States" },
            "audience": {
              "@type": "Audience",
              "audienceType": "Healthcare practices, physician practices, dental practices and clinics"
            },
            "description": "AI-driven revenue cycle management for medical practices - eligibility verification, prior authorization, charge capture and coding, claims submission, denial management and patient collections - plus a 24/7 AI receptionist and self check-in, integrated with Epic and athenahealth."
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What does MedXFlow do?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "MedXFlow runs your entire revenue cycle with AI agents - scheduling, eligibility, prior authorization, coding, claims, payment posting, denial management and patient collections - plus a 24/7 AI front desk (voice, chat and check-in) and telehealth. One connected platform, from the first appointment to the final payment."
                }
              },
              {
                "@type": "Question",
                "name": "Is patient data secure and HIPAA compliant?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. MedXFlow handles PHI to HIPAA standards and offers a Business Associate Agreement (BAA), with security controls aligned to SOC 2 Type II. Everything is stored in US data centers, encrypted in transit and at rest, with least-privilege access and full audit logging. We never sell data or use patient information to train public models."
                }
              },
              {
                "@type": "Question",
                "name": "Which EHRs and clearinghouses does it work with?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "MedXFlow writes bookings, arrivals, charges and payments straight into the systems you already run - Epic, athenahealth, eClinicalWorks and more - and submits claims to every major payer and clearinghouse. No rip-and-replace, with a fallback mode that works even before formal integration."
                }
              },
              {
                "@type": "Question",
                "name": "Do the AI agents replace our billing team?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Only the repetitive work. The agents handle the volume and hand anything they are unsure about to your staff - AI backed by humans, never left unattended. Prefer to hand it all over? Our human-led Managed Billing team can run the whole cycle for you. Either way, every action is tracked, assigned and auditable."
                }
              },
              {
                "@type": "Question",
                "name": "How long does setup take?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Most practices are live within a week. We connect your EHR (Epic, athenahealth and more), configure your workflows and payer rules, and run a supervised pilot before MedXFlow goes live on real work."
                }
              },
              {
                "@type": "Question",
                "name": "What are the contract terms?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Practices get a 30-day trial and free setup, with no long lock-in - cancel with 30 days notice."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
