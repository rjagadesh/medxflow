<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/fav.png" />

    <!-- Faster web-font loading (removes render-blocking hop) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
    />

    <title>MedXFlow - AI Revenue Cycle Management &amp; Medical Billing</title>
    <meta
      name="description"
      content="AI revenue cycle management for medical practices - eligibility, prior authorization, claims, denial management and patient collections - plus a 24/7 AI receptionist, integrated with Epic and athenahealth."
    />
    <meta name="robots" content="index, follow" />

    <!-- Canonical - update to your live domain -->
    <link rel="canonical" href="https://medxflow.ai/" />

    <!-- Open Graph (LinkedIn, Facebook, iMessage, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MedXFlow Health" />
    <meta property="og:title" content="MedXFlow - AI Revenue Cycle Management &amp; Medical Billing" />
    <meta
      property="og:description"
      content="AI revenue cycle management - eligibility, prior auth, claims, denials and collections - plus a 24/7 AI receptionist. Integrated with Epic and athenahealth."
    />
    <meta property="og:url" content="https://medxflow.ai/" />
    <meta property="og:image" content="https://medxflow.ai/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MedXFlow - AI revenue cycle management and medical billing for practices" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MedXFlow - AI Revenue Cycle Management &amp; Medical Billing" />
    <meta
      name="twitter:description"
      content="AI revenue cycle management - eligibility, prior auth, claims, denials and collections - plus a 24/7 AI receptionist. Integrated with Epic and athenahealth."
    />
    <meta name="twitter:image" content="https://medxflow.ai/og-image.jpg" />

    <meta name="theme-color" content="#0D2B52" />

    <!-- Structured data: Organization, WebSite, Service, FAQ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://medxflow.ai/#organization",
            "name": "MedXFlow Health",
            "url": "https://medxflow.ai/",
            "logo": "https://medxflow.ai/logo.png",
            "description": "AI revenue cycle management and front-desk automation for medical practices - eligibility, prior authorization, claims, denial management and patient collections, plus a 24/7 AI receptionist and check-in, integrated with Epic and athenahealth.",
            "email": "sales@medxflow.ai",
            "telephone": "+1-210-396-9718",
            "areaServed": "US"
          },
          {
            "@type": "WebSite",
            "@id": "https://medxflow.ai/#website",
            "url": "https://medxflow.ai/",
            "name": "MedXFlow",
            "publisher": { "@id": "https://medxflow.ai/#organization" },
            "inLanguage": "en-US"
          },
          {
            "@type": "Service",
            "name": "MedXFlow - AI revenue cycle management for medical practices",
            "serviceType": "Revenue cycle management, medical billing and AI front desk",
            "provider": { "@id": "https://medxflow.ai/#organization" },
            "areaServed": { "@type": "Country", "name": "United States" },
            "audience": {
              "@type": "Audience",
              "audienceType": "Healthcare practices, physician practices, dental practices and clinics"
            },
            "description": "AI-driven revenue cycle management for medical practices - eligibility verification, prior authorization, charge capture and coding, claims submission, denial management and patient collections - plus a 24/7 AI receptionist and self check-in, integrated with Epic and athenahealth."
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is patient data secure and HIPAA compliant?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. MedXFlow is built for US healthcare: data is stored in US data centers, encrypted in transit and at rest, and handled under a HIPAA Business Associate Agreement. We use least-privilege access and full audit logging, and never sell data or use patient information to train public models."
                }
              },
              {
                "@type": "Question",
                "name": "How long does setup take?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Most practices are live within a week. We connect to your EHR (Epic or athenahealth), configure your call flows and appointment types, and run a supervised pilot before MedXFlow answers live calls."
                }
              },
              {
                "@type": "Question",
                "name": "What are the contract terms?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Practices get a 60-day trial and free setup, with no long lock-in - cancel with 30 days notice."
                }
              },
              {
                "@type": "Question",
                "name": "What happens when the AI can't handle a call?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "MedXFlow knows its limits. Anything clinical, urgent, or out of scope is warm-transferred to your team or flagged for callback, with a full transcript. It augments your reception and never overrides clinical judgment."
                }
              },
              {
                "@type": "Question",
                "name": "Does it work with our phone system and EHR?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. MedXFlow sits alongside your existing phone number and writes bookings, arrivals, and payments straight into Epic and athenahealth. No rip-and-replace."
                }
              },
              {
                "@type": "Question",
                "name": "Which languages does it support?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "English and Spanish today, with a warm, natural-sounding voice and accessibility options such as larger type and a slower pace for older patients."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
